name: Sync to Gitee

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync to Gitee
        uses: wearerequired/git-mirror-action@v1 # 确认使用最新版本
        with:
          # 新的参数名：source-repo 和 destination-repo
          # 源仓库（可选，不填默认为当前仓库）
          # source-repo:

          # 目标仓库（格式不变）
          destination-repo: https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_PRIVATE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/${{ github.event.repository.name }}.git